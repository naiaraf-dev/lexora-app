<header class="w-full h-14 bg-white border-b border-gray-200 flex items-center justify-end px-6 relative z-50">

  <!-- User Button -->
  <button
    (click)="toggleDropdown()"
    class="flex items-center gap-2.5 hover:bg-black/5 rounded-lg px-2 py-1.5 transition-all duration-200"
  >
    <!-- Avatar -->
    <div class="w-8 h-8 rounded-full overflow-hidden bg-text-primary/10 flex items-center justify-center shrink-0">
      @if (user.avatarUrl) {
        <img [src]="user.avatarUrl" [alt]="user.name" class="w-full h-full object-cover" />
      } @else {
        <span class="text-xs font-semibold text-text-primary">{{ userInitials }}</span>
      }
    </div>

    <!-- Name -->
    <span class="text-sm font-medium text-text-primary hidden sm:block">{{ user.name }}</span>

    <!-- Chevron -->
    <svg
      xmlns="http://www.w3.org/2000/svg"
      class="w-4 h-4 text-text-primary/50 transition-transform duration-200"
      [class.rotate-180]="dropdownOpen()"
      fill="none"
      viewBox="0 0 24 24"
      stroke="currentColor"
      stroke-width="2"
    >
      <path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7" />
    </svg>
  </button>

  <!-- Dropdown -->
  @if (dropdownOpen()) {
    <div class="absolute top-12 right-4 w-64 bg-white rounded-xl shadow-xl border border-black/8 py-2 z-50 animate-[fadeSlideIn_0.15s_ease-out]">

      <!-- User Info -->
      <div class="flex items-center gap-3 px-4 py-3">
        <div class="w-10 h-10 rounded-full overflow-hidden bg-text-primary/10 flex items-center justify-center shrink-0">
          @if (user.avatarUrl) {
            <img [src]="user.avatarUrl" [alt]="user.name" class="w-full h-full object-cover" />
          } @else {
            <span class="text-sm font-semibold text-text-primary">{{ userInitials }}</span>
          }
        </div>
        <div class="flex flex-col min-w-0">
          <span class="text-sm font-semibold text-text-primary truncate">{{ user.name }}</span>
          <span class="text-xs text-text-primary/50 truncate">{{ user.email }}</span>
        </div>
      </div>

      <!-- Divider -->
      <div class="mx-4 my-1 h-px bg-black/8"></div>

      <!-- Menu Items -->
      <div class="py-1">

        <!-- Perfil -->
        <a [routerLink]="['/configuracion']" [queryParams]="{ tab: 'perfil' }" (click)="closeDropdown()"
          class="flex items-center gap-3 px-4 py-2.5 text-sm text-text-primary hover:bg-text-primary/5 transition-colors duration-150 cursor-pointer">
          <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 text-text-primary/50" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
            <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 6a3.75 3.75 0 11-7.5 0 3.75 3.75 0 017.5 0zM4.501 20.118a7.5 7.5 0 0114.998 0A17.933 17.933 0 0112 21.75c-2.676 0-5.216-.584-7.499-1.632z" />
          </svg>
          <span>Perfil</span>
        </a>

        <!-- Seguridad y Privacidad -->
        <a [routerLink]="['/configuracion']" [queryParams]="{ tab: 'seguridad' }" (click)="closeDropdown()"
          class="flex items-center gap-3 px-4 py-2.5 text-sm text-text-primary hover:bg-text-primary/5 transition-colors duration-150 cursor-pointer">
          <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 text-text-primary/50" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-8V7a4 4 0 00-8 0v4h8z" />
          </svg>
          <span>Seguridad y Privacidad</span>
        </a>

        <!-- Dark Mode Toggle -->
        <div class="flex items-center justify-between px-4 py-2.5">
          <div class="flex items-center gap-3">
            <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 text-text-primary/50" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
              <path stroke-linecap="round" stroke-linejoin="round" d="M21.752 15.002A9.72 9.72 0 0118 15.75c-5.385 0-9.75-4.365-9.75-9.75 0-1.33.266-2.597.748-3.752A9.753 9.753 0 003 11.25C3 16.635 7.365 21 12.75 21a9.753 9.753 0 009.002-5.998z" />
            </svg>
            <span class="text-sm text-text-primary">Dark mode</span>
          </div>
          <button
            (click)="toggleDarkMode()"
            class="relative w-10 h-5 rounded-full transition-colors duration-200 focus:outline-none"
            [class.bg-[#6366F1]]="darkMode()"
            [class.bg-black/20]="!darkMode()"
          >
            <span
              class="absolute top-0.5 left-0.5 w-4 h-4 bg-white rounded-full shadow-sm transition-transform duration-200"
              [class.translate-x-5]="darkMode()"
            ></span>
          </button>
        </div>

      </div>

      <!-- Divider -->
      <div class="mx-4 my-1 h-px bg-black/8"></div>

      <!-- Cerrar Sesión -->
      <div class="py-1">
        <button
          (click)="onLogout()"
          class="flex items-center gap-3 px-4 py-2.5 text-sm text-red-500 hover:bg-red-50 transition-colors duration-150 w-full text-left"
        >
          <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
            <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 9V5.25A2.25 2.25 0 0013.5 3h-6a2.25 2.25 0 00-2.25 2.25v13.5A2.25 2.25 0 007.5 21h6a2.25 2.25 0 002.25-2.25V15m3 0l3-3m0 0l-3-3m3 3H9" />
          </svg>
          <span>Cerrar Sesión</span>
        </button>
      </div>

    </div>
  }

</header>
