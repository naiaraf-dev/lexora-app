<section class="bg-white rounded-xl border border-gray-200 shadow-sm p-6">

  @if (title) {
    <header class="flex items-center justify-between mb-5">
      <h2 class="text-base font-semibold text-text-primary">{{ title }}</h2>

      <div class="flex items-center gap-3">
        <ng-content select="[slot=header-actions]" />

        @if (collapsible) {
          <button
            type="button"
            (click)="toggle()"
            class="text-gray-400 hover:text-gray-600 transition-colors"
            [attr.aria-label]="collapsed() ? 'Expandir' : 'Colapsar'">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              @if (collapsed()) {
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4.5v15m7.5-7.5h-15" />
              } @else {
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 12h14" />
              }
            </svg>
          </button>
        }
      </div>
    </header>
  }

  @if (!collapsed()) {
    <ng-content />
  }

</section>
