<div class="relative flex flex-col gap-1">
    @if (label) {
        <label class="text-xs font-medium text-text-primary/60">{{ label }}</label>
    }

    <button
        type="button"
        [disabled]="disabled"
        (click)="toggleAbierto()"
        class="flex items-center justify-between gap-2 px-3 py-2 rounded-lg border bg-white text-sm text-left transition-all duration-200
            focus:outline-none focus:ring-2 focus:ring-primary/30 focus:border-primary
            disabled:bg-gray-100 disabled:text-text-primary/50 disabled:cursor-not-allowed"
        [class]="abierto ? 'border-primary ring-2 ring-primary/30' : 'border-gray-200'"
    >
        <span [class]="textoMostrado ? 'text-text-primary' : 'text-text-primary/40'">
            {{ textoMostrado || 'dd/mm/aaaa' }}
        </span>
        <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 text-text-primary/40 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" />
        </svg>
    </button>

    @if (abierto) {
        <div
            class="absolute z-20 left-0 w-full bg-white rounded-xl border border-gray-200 shadow-lg p-3 flex flex-col gap-2"
            [class.top-full]="!abrirHaciaArriba"
            [class.mt-1]="!abrirHaciaArriba"
            [class.bottom-full]="abrirHaciaArriba"
            [class.mb-1]="abrirHaciaArriba"
        >

            <!-- Header: mes + navegación -->
            <div class="flex items-center justify-between px-1">
                <button type="button" (click)="mesAnterior()" class="p-1 rounded-lg hover:bg-gray-100 text-text-primary/50 transition-colors">
                    <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7" />
                    </svg>
                </button>

                <span class="text-sm font-semibold text-text-primary">{{ etiquetaMes }}</span>

                <button type="button" (click)="mesSiguiente()" class="p-1 rounded-lg hover:bg-gray-100 text-text-primary/50 transition-colors">
                    <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7" />
                    </svg>
                </button>
            </div>

            <!-- Días de la semana -->
            <div class="grid grid-cols-7 gap-1">
                @for (dia of diasSemana; track dia) {
                    <span class="text-[10px] font-semibold text-text-primary/40 text-center py-1">{{ dia }}</span>
                }
            </div>

            <!-- Grid de días -->
            <div class="grid grid-cols-7 gap-1">
                @for (celda of celdas; track celda.fecha.getTime()) {
                    <button
                        type="button"
                        (click)="elegirDia(celda)"
                        [disabled]="!celda.delMesActual || celda.deshabilitada"
                        class="h-8 w-8 rounded-lg text-xs flex items-center justify-center transition-colors"
                        [class]="celda.seleccionado
                            ? 'bg-primary text-white font-semibold'
                            : (celda.deshabilitada
                                ? 'text-text-primary/20 cursor-not-allowed'
                                : (celda.delMesActual
                                    ? (celda.esHoy ? 'text-primary font-semibold border border-primary/40 hover:bg-primary/10' : 'text-text-primary hover:bg-gray-100')
                                    : 'text-text-primary/20 cursor-default'))"
                    >
                        {{ celda.dia }}
                    </button>
                }
            </div>

            <!-- Footer: Borrar / Hoy -->
            <div class="flex items-center justify-between pt-2 border-t border-gray-100">
                <button type="button" (click)="borrar()" class="text-xs font-medium text-text-primary/50 hover:text-text-primary transition-colors">
                    Borrar
                </button>
                <button type="button" (click)="irAHoy()" class="text-xs font-medium text-primary hover:text-primary/80 transition-colors">
                    Hoy
                </button>
            </div>
        </div>
    }
</div>
