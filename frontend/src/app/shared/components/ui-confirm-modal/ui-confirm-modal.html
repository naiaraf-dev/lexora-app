<app-ui-modal [open]="open" (cerrar)="cancelar.emit()">

  <div slot="titulo" class="flex items-center gap-2">
    <div class="w-8 h-8 rounded-lg bg-danger/10 flex items-center justify-center">
      <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 text-danger" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v3.75m-9.303 3.376c-.866 1.5.217 3.374 1.948 3.374h14.71c1.73 0 2.813-1.874 1.948-3.374L13.949 3.378c-.866-1.5-3.032-1.5-3.898 0L2.697 16.126zM12 15.75h.007v.008H12v-.008z" />
      </svg>
    </div>
    <span class="font-semibold text-text-primary">{{ titulo }}</span>
  </div>

  <div slot="cuerpo">
    <p class="text-sm text-text-primary/70">{{ mensaje }}</p>
  </div>

  <div slot="footer" class="flex justify-end gap-2">
    <app-primary-btn variant="secondary" (click)="cancelar.emit()">Cancelar</app-primary-btn>
    <app-primary-btn variant="danger" (click)="confirmar.emit()">{{ labelConfirmar }}</app-primary-btn>
  </div>

</app-ui-modal>
