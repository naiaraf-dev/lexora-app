<app-ui-modal [open]="open" (cerrar)="cerrar.emit()">

  <div slot="titulo" class="flex items-center gap-2">
    <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 text-white bg-primary rounded p-0.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
      <path stroke-linecap="round" stroke-linejoin="round" d="M17 9V7a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2m2 4h10a2 2 0 002-2v-6a2 2 0 00-2-2H9a2 2 0 00-2 2v6a2 2 0 002 2zm7-5a2 2 0 11-4 0 2 2 0 014 0z" />
    </svg>
    <span class="font-semibold text-text-primary dark:text-slate-100">Registrar pago</span>
  </div>

  <div slot="cuerpo" class="flex flex-col gap-4">

    <!-- Resumen saldos -->
    <div class="rounded-xl border border-gray-100 dark:border-slate-700 bg-gray-50/60 dark:bg-slate-700/30 px-4 py-3 grid grid-cols-3 gap-4 text-sm">
      <div class="flex flex-col gap-0.5">
        <span class="text-xs text-text-primary/40 dark:text-slate-500">Monto previsto</span>
        <span class="font-semibold text-text-primary dark:text-slate-100">{{ resumen.montoPrevisto }}</span>
      </div>
      <div class="flex flex-col gap-0.5">
        <span class="text-xs text-text-primary/40 dark:text-slate-500">Monto pagado</span>
        <span class="font-semibold text-success">{{ resumen.montoPagado }}</span>
      </div>
      <div class="flex flex-col gap-0.5">
        <span class="text-xs text-text-primary/40 dark:text-slate-500">Saldo pendiente</span>
        <span class="font-semibold text-warning">{{ resumen.saldoPendiente }}</span>
      </div>
    </div>

    <div class="grid grid-cols-2 gap-3">
      <app-ui-date-input label="Fecha de pago" [(model)]="form.fecha"></app-ui-date-input>
      <app-ui-input      label="Monto" placeholder="$ 0,00" [(model)]="form.monto"></app-ui-input>
      <app-ui-select     label="Medio de pago" variant="formulario" placeholder="Seleccioná..." [(model)]="form.medio" [options]="medioOptions"></app-ui-select>
      <app-ui-input      label="Referencia" placeholder="N° de operación, cheque, etc." [(model)]="form.referencia"></app-ui-input>
    </div>

    <div class="flex flex-col gap-1">
      <label class="text-xs font-medium text-text-primary/60 dark:text-slate-400">Observaciones</label>
      <textarea [(ngModel)]="form.observaciones" rows="2"
        class="px-3 py-2 rounded-lg border border-gray-200 dark:border-slate-700 bg-white dark:bg-slate-900 text-sm text-text-primary dark:text-slate-100 resize-none focus:outline-none focus:ring-2 focus:ring-primary/30 focus:border-primary transition-all placeholder:text-text-primary/30 dark:placeholder:text-slate-500"></textarea>
    </div>

    <!-- Comprobante de pago -->
    <div class="flex flex-col gap-1">
      <label class="text-xs font-medium text-text-primary/60 dark:text-slate-400">Comprobante de pago</label>
      @if (comprobante) {
        <div class="flex items-center gap-3 px-4 py-3 rounded-lg border border-primary/20 dark:border-primary/30 bg-primary/5 dark:bg-primary/10">
          <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 text-primary shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
            <path stroke-linecap="round" stroke-linejoin="round" d="M19.5 14.25v-2.625a3.375 3.375 0 00-3.375-3.375h-1.5A1.125 1.125 0 0113.5 7.125v-1.5a3.375 3.375 0 00-3.375-3.375H8.25m2.25 0H5.625c-.621 0-1.125.504-1.125 1.125v17.25c0 .621.504 1.125 1.125 1.125h12.75c.621 0 1.125-.504 1.125-1.125V11.25a9 9 0 00-9-9z" />
          </svg>
          <span class="text-sm text-primary font-medium flex-1 truncate">{{ comprobante.name }}</span>
          <button type="button" (click)="eliminarComprobante()" class="text-text-primary/30 dark:text-slate-500 hover:text-danger transition-colors">
            <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
            </svg>
          </button>
        </div>
      } @else {
        <label
          class="flex items-center gap-3 px-4 py-4 rounded-lg border border-dashed border-gray-300 dark:border-slate-700 bg-gray-50 dark:bg-slate-700/50 hover:bg-gray-100 dark:hover:bg-slate-700 transition w-full text-left cursor-pointer"
          (dragover)="$event.preventDefault()"
          (drop)="onDrop($event)"
        >
          <input type="file" class="hidden" accept=".pdf,.jpg,.jpeg,.png" (change)="onFileChange($event)" />
          <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 text-gray-400 dark:text-slate-500 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
            <path stroke-linecap="round" stroke-linejoin="round" d="M18.375 12.739l-7.693 7.693a4.5 4.5 0 01-6.364-6.364l10.94-10.94A3 3 0 1119.5 7.372L8.552 18.32m.009-.01l-.01.01m5.699-9.941l-7.81 7.81a1.5 1.5 0 002.112 2.13" />
          </svg>
          <div class="flex flex-col">
            <span class="text-sm text-text-primary/60 dark:text-slate-400">Adjuntar comprobante</span>
            <span class="text-xs text-text-primary/30 dark:text-slate-500">PDF, JPG, PNG hasta 10MB</span>
          </div>
        </label>
      }
    </div>

  </div>

  <div slot="footer" class="flex justify-end gap-2">
    <app-primary-btn variant="secondary" (click)="cerrarModal()">Cancelar</app-primary-btn>
    <app-primary-btn variant="primary" [loading]="guardando" (click)="guardar()">Registrar pago</app-primary-btn>
  </div>

</app-ui-modal>
