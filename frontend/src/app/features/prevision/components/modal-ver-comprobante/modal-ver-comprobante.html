<app-ui-modal [open]="open" size="lg" (cerrar)="cerrar.emit()">

  <div slot="titulo" class="flex items-center gap-2">
    <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 text-white bg-primary rounded p-0.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
      <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0z" />
      <path stroke-linecap="round" stroke-linejoin="round" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
    </svg>
    <span class="font-semibold text-text-primary dark:text-slate-100">{{ comprobante?.nombre || 'Comprobante' }}</span>
  </div>

  <div slot="cuerpo" class="flex flex-col gap-3">
    @if (comprobante) {
      @if (esImagen) {
        <img [src]="comprobante.url" [alt]="comprobante.nombre"
          class="w-full max-h-[70vh] object-contain rounded-lg border border-gray-100 dark:border-slate-700" />
      } @else if (esPdf) {
        <iframe [src]="urlSegura" class="w-full h-[70vh] rounded-lg border border-gray-100 dark:border-slate-700"></iframe>
      } @else {
        <div class="flex flex-col items-center gap-3 py-10 text-center">
          <svg xmlns="http://www.w3.org/2000/svg" class="w-10 h-10 text-text-primary/20 dark:text-slate-600" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
            <path stroke-linecap="round" stroke-linejoin="round" d="M19.5 14.25v-2.625a3.375 3.375 0 00-3.375-3.375h-1.5A1.125 1.125 0 0113.5 7.125v-1.5a3.375 3.375 0 00-3.375-3.375H8.25m2.25 0H5.625c-.621 0-1.125.504-1.125 1.125v17.25c0 .621.504 1.125 1.125 1.125h12.75c.621 0 1.125-.504 1.125-1.125V11.25a9 9 0 00-9-9z" />
          </svg>
          <p class="text-sm text-text-primary/40 dark:text-slate-500">Vista previa no disponible para este tipo de archivo.</p>
        </div>
      }
    }
  </div>

  <div slot="footer" class="flex justify-between gap-2">
    @if (comprobante) {
      <a [href]="comprobante.url" [download]="comprobante.nombre"
        class="flex items-center gap-1.5 px-4 py-2 text-sm font-medium text-primary hover:underline">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8">
          <path stroke-linecap="round" stroke-linejoin="round" d="M4 16v2a2 2 0 002 2h12a2 2 0 002-2v-2" />
          <path stroke-linecap="round" stroke-linejoin="round" d="M7 10l5 5 5-5" />
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 3v12" />
        </svg>
        Descargar
      </a>
    } @else {
      <div></div>
    }
    <app-primary-btn variant="secondary" (click)="cerrar.emit()">Cerrar</app-primary-btn>
  </div>

</app-ui-modal>
