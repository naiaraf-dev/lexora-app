<app-auth-layout>
  <app-auth-card title="Nueva contraseña" subtitle="Ingresá tu nueva contraseña">

    <svg auth-icon class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
        d="M16.5 10.5V6.75a4.5 4.5 0 10-9 0v3.75m-.75 11.25h10.5a2.25 2.25 0 002.25-2.25v-6.75a2.25 2.25 0 00-2.25-2.25H6.75a2.25 2.25 0 00-2.25 2.25v6.75a2.25 2.25 0 002.25 2.25z" />
    </svg>

    <div class="flex flex-col gap-4">
      <div class="flex flex-col gap-1">
        <app-ui-input label="Nueva contraseña" type="password" placeholder="Min. 8 caracteres" [(model)]="password" />
      </div>
      <div class="flex flex-col gap-1">
        <app-ui-input label="Repetir contraseña" type="password" placeholder="Repetí la contraseña" [(model)]="confirmPassword" />
      </div>

      @if (error()) {
        <p class="text-xs text-danger">{{ error() }}</p>
      }

      <app-primary-btn [full]="true" [loading]="loading()" [disabled]="loading()" (click)="submit()">
        Guardar contraseña
      </app-primary-btn>
    </div>

    <div class="flex justify-center mt-4">
      <a routerLink="/login" class="inline-flex items-center gap-2 text-sm text-gray-500 hover:text-text-primary transition-colors font-medium">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.5 19.5L3 12m0 0l7.5-7.5M3 12h18" />
        </svg>
        Volver a Iniciar Sesión
      </a>
    </div>

  </app-auth-card>
</app-auth-layout>
