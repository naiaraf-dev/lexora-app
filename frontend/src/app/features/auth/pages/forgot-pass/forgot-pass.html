<app-auth-layout>
  <app-auth-card title="¿Olvidaste la contraseña?" subtitle="Ingresá tu correo y te enviaremos un enlace para reestablecerla">

    <svg auth-icon class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
        d="M21.75 6.75v10.5a2.25 2.25 0 01-2.25 2.25h-15a2.25 2.25 0 01-2.25-2.25V6.75m19.5 0A2.25 2.25 0 0019.5 4.5h-15a2.25 2.25 0 00-2.25 2.25m19.5 0v.243a2.25 2.25 0 01-1.07 1.916l-7.5 4.615a2.25 2.25 0 01-2.36 0L3.32 8.91a2.25 2.25 0 01-1.07-1.916V6.75" />
    </svg>

    @if (!sent()) {
      <form (ngSubmit)="onSubmit()" class="flex flex-col gap-4">
        <div class="flex flex-col gap-1">
          <app-ui-input
            label="Email"
            type="email"
            placeholder="nombre@estudio.com"
            [(model)]="email"
          />
          @if (errors().email) {
            <p class="text-xs text-danger">{{ errors().email }}</p>
          }
        </div>
        <app-primary-btn [full]="true" [loading]="loading()" [disabled]="loading()">
          Enviar enlace
        </app-primary-btn>
      </form>
    } @else {
      <p class="text-center text-sm text-gray-500 mb-1">Si existe una cuenta asociada a</p>
      <p class="text-center text-sm font-semibold text-text-primary mb-4 break-all">{{ email }}</p>
      <p class="text-center text-xs text-gray-400">recibirás un enlace para reestablecer tu contraseña en los próximos minutos.</p>
    }

    <div class="flex justify-center mt-4">
      <a routerLink="/login" class="inline-flex items-center gap-2 text-sm text-gray-500 hover:text-text-primary transition-colors font-medium">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.5 19.5L3 12m0 0l7.5-7.5M3 12h18" />
        </svg>
        Volver a Iniciar Sesión
      </a>
    </div>

  </app-auth-card>
</app-auth-layout>
