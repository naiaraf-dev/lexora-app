<app-ui-modal [open]="open" (cerrar)="cerrar.emit()">
  <div slot="titulo" class="flex items-center gap-2">
    <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 text-white bg-primary rounded p-0.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
      <path stroke-linecap="round" stroke-linejoin="round" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5" />
      <path stroke-linecap="round" stroke-linejoin="round" d="M18.414 2.586a2 2 0 012.828 2.828L11.828 14H9v-2.828l9.414-9.414z" />
    </svg>
    <span class="font-semibold text-text-primary">Editar Documento</span>
  </div>

  <div slot="cuerpo" class="flex flex-col gap-4">
    <div class="grid grid-cols-2 gap-3">
      <app-ui-select label="Tipo de documento" [(model)]="form.tipo" [options]="tipoOptions"></app-ui-select>
      <app-ui-date-input label="Fecha del documento" [(model)]="form.fechaDocumento"></app-ui-date-input>
    </div>
    <app-ui-select label="Relacionado con (opcional)" [(model)]="form.relacionadoId" [options]="novedadOpciones"></app-ui-select>
    <div class="flex flex-col gap-1">
      <label class="text-xs font-medium text-text-primary/60">Descripción</label>
      <textarea
        [(ngModel)]="form.descripcion"
        placeholder="Descripción del documento..."
        rows="4"
        class="px-3 py-2 rounded-lg border border-gray-200 bg-white text-sm text-text-primary resize-none focus:outline-none focus:ring-2 focus:ring-primary/30 focus:border-primary transition-all"
      ></textarea>
    </div>
  </div>

  <div slot="footer" class="flex justify-end gap-2">
    <app-primary-btn variant="secondary" (click)="cerrar.emit()">Cancelar</app-primary-btn>
    <app-primary-btn variant="primary" [loading]="guardando" (click)="submit()">
      <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M17 3H5a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2V7l-4-4z" />
        <path stroke-linecap="round" stroke-linejoin="round" d="M17 3v4H7V3" /><path stroke-linecap="round" stroke-linejoin="round" d="M12 12a3 3 0 100 6 3 3 0 000-6z" />
      </svg>
      Guardar Cambios
    </app-primary-btn>
  </div>
</app-ui-modal>
