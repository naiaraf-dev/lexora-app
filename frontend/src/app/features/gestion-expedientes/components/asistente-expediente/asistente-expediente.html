@if (numero()) {
  <app-asistente-chat class="h-[calc(100vh-16rem)] block" [contextoExpediente]="numero()" />
} @else if (error()) {
  <div class="px-4 py-3 rounded-xl bg-red-50 dark:bg-red-900/30 text-sm text-red-700 dark:text-red-300">
    {{ error() }}
  </div>
}

<div class="fixed bottom-0 right-0 px-6 py-4 z-10">
  <app-primary-btn variant="secondary" (click)="volver()">
    ← Volver a bandeja
  </app-primary-btn>
</div>
