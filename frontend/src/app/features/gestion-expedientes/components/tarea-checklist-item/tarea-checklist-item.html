<button
    type="button"
    (click)="seleccionar.emit()"
    class="w-full flex items-center gap-3 px-4 py-3 text-left bg-white rounded-xl border transition-colors"
    [class]="seleccionada
        ? 'border-primary/40 bg-primary/5 border-l-4 border-l-primary'
        : 'border-black/8 hover:bg-gray-50'"
>
    <span class="text-xs font-semibold text-text-primary/30 w-6 shrink-0">{{ numero.toString().padStart(2, '0') }}</span>

    @if (tarea.estado === 'COMPLETADO') {
        <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 text-success shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" />
        </svg>
    } @else if (tarea.estado === 'NO_PROCEDENTE') {
        <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 text-text-primary/30 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M18.364 18.364A9 9 0 105.636 5.636a9 9 0 0012.728 12.728zM6 18L18 6" />
        </svg>
    } @else {
        <span class="w-5 h-5 rounded-full border-2 border-gray-300 shrink-0"></span>
    }

    <span class="flex-1 text-sm text-text-primary truncate">{{ tarea.descripcion }}</span>

    @if (tarea.fechaVencimiento) {
        <span class="text-[10px] text-text-primary/40 shrink-0 hidden sm:inline">
            Vence {{ tarea.fechaVencimiento | date:'dd/MM/yyyy' }}
        </span>
    }
    @if (tarea.enviarAgenda) {
        <span class="text-[10px] text-primary shrink-0 hidden sm:inline">En agenda</span>
    }
    @if (tarea.archivos.length > 0) {
        <span class="text-[10px] text-text-primary/40 shrink-0 hidden sm:inline">{{ tarea.archivos.length }} adj.</span>
    }

    <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 text-text-primary/30 shrink-0 transition-transform" [class.rotate-90]="seleccionada" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7" />
    </svg>
</button>
