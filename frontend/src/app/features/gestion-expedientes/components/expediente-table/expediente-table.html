<div class="bg-white rounded-xl border border-black/8 overflow-hidden">
  <div class="bg-white rounded-xl border border-black/8 overflow-hidden">
    <app-ui-table
      [columns]="columns"
      [data]="expedientes"
      (action)="onAction($event)"
    ></app-ui-table>

    <div class="flex items-center justify-between px-4 py-3 border-t border-gray-100 text-xs text-text-primary/40">
      <span>Mostrando {{ expedientes.length }} de {{ total }} expedientes</span>
      <app-ui-pagination
        [paginaActual]="currentPage"
        [totalPaginas]="totalPages"
        (cambio)="onPageChange($event)"
      ></app-ui-pagination>
    </div>
  </div>
  
  <!-- Modal confirmación eliminar -->
  <app-ui-confirm-modal
    [open]="!!expedienteAEliminar"
    titulo="Eliminar expediente"
    [mensaje]="mensajeConfirmarEliminar"
    labelConfirmar="Eliminar"
    (confirmar)="confirmarEliminar()"
    (cancelar)="cancelarEliminar()"
  ></app-ui-confirm-modal>

</div>
