<div class="flex flex-wrap items-center gap-3">
  <app-ui-input
    label="Documento"
    placeholder="Buscar por nombre..."
    [(model)]="filters.nombre"
    (modelChange)="filtersChange.emit({...filters})"
  ></app-ui-input>

  <app-ui-select
    label="Tipo de documento"
    [(model)]="filters.tipo"
    [options]="tipoOptions"
    (modelChange)="filtersChange.emit({...filters})"
  ></app-ui-select>
</div>
