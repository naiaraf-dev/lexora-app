<div class="bg-white rounded-xl border border-black/8 overflow-hidden">

  <!-- Trigger colapsable -->
  <button
    (click)="filtrosAbiertos.set(!filtrosAbiertos())"
    class="w-full flex items-center gap-2 px-5 py-4 text-sm font-semibold text-text-primary hover:bg-gray-50 transition"
  >
    <svg
      xmlns="http://www.w3.org/2000/svg"
      class="w-4 h-4 transition-transform duration-200"
      [class.rotate-180]="!filtrosAbiertos()"
      fill="none"
      viewBox="0 0 24 24"
      stroke="currentColor"
      stroke-width="2"
    >
      <path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7" />
    </svg>
    Filtrar Expedientes
  </button>

  @if (filtrosAbiertos()) {
    <div class="px-5 pb-5 flex flex-col gap-4 border-t border-gray-100">

      <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mt-4">
        <app-ui-input label="N° Expediente" placeholder="N° expediente..." [(model)]="filters.numero"></app-ui-input>
        <app-ui-input label="N° Causa"      placeholder="N° causa..."      [(model)]="filters.causa"></app-ui-input>
        <app-ui-input label="Carátula"      placeholder="Buscar por carátula..." [(model)]="filters.caratula"></app-ui-input>
      </div>

      <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
        <app-ui-select label="Área"              [(model)]="filters.area"      [options]="areaOptions"></app-ui-select>
        <app-ui-select label="Tipo de expediente" [(model)]="filters.tipo"     [options]="tipoOptions"></app-ui-select>
        <app-ui-select label="Estado"            [(model)]="filters.estado"    [options]="estadoOptions"></app-ui-select>
        <app-ui-select label="Cliente"           [(model)]="filters.clienteId" [options]="clienteOptions"></app-ui-select>
      </div>

      <div class="flex justify-center gap-3 mt-2">
        <button
          (click)="buscar()"
          class="px-8 py-2 bg-primary text-white text-sm font-medium rounded-lg hover:bg-primary/90 transition"
        >
          Buscar
        </button>
        <button
          (click)="limpiar()"
          class="px-8 py-2 border border-gray-200 text-sm font-medium rounded-lg hover:bg-gray-50 transition"
        >
          Limpiar
        </button>
      </div>

    </div>
  }

</div>
