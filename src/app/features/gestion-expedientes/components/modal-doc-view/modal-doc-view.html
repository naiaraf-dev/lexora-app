<app-ui-modal [open]="open" (cerrar)="cerrar.emit()">
  <div slot="titulo" class="flex items-center gap-2">
    <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 text-white bg-primary rounded p-0.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
      <path stroke-linecap="round" stroke-linejoin="round" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
    </svg>
    <span class="font-semibold text-text-primary">Detalle del Documento</span>
  </div>

  <div slot="cuerpo" class="flex flex-col gap-4">
    @if (documento) {
      <div class="grid grid-cols-2 gap-3">
        <app-ui-input label="Tipo de documento" [model]="documento.tipoLabel" [disabled]="true"></app-ui-input>
        <app-ui-date-input label="Fecha del documento" [model]="documento.fechaDocumento"></app-ui-date-input>
      </div>
      <app-ui-input label="Relacionado con" [model]="documento.relacionadoCon" [disabled]="true"></app-ui-input>
      <div class="flex flex-col gap-1">
        <label class="text-xs font-medium text-text-primary/60">Descripción</label>
        <textarea
          [value]="documento.descripcion"
          disabled
          rows="4"
          class="px-3 py-2 rounded-lg border border-gray-200 bg-white text-sm text-text-primary resize-none opacity-50 cursor-not-allowed"
        ></textarea>
      </div>
    }
  </div>

  <div slot="footer"></div>
</app-ui-modal>
